---
- name: Validar disponibilidad de las instancias
  hosts: hosts
  gather_facts: no
  tasks:
    - name: Esperar conexión SSH activa antes de configurar
      wait_for_connection:
        delay: 10
        timeout: 120
        
# Basic configuration of all defined devices
- name: Pre-configurar entorno, zona horaria y protección apt
  hosts: all
  gather_facts: no
  become: yes
  tasks:
    - name: "PROC-022 | Prevenir congelamiento de apt/rsyslog mediante policy-rc.d"
      ansible.builtin.raw: |
        echo '#!/bin/sh' > /usr/sbin/policy-rc.d
        echo 'exit 101' >> /usr/sbin/policy-rc.d
        chmod 0755 /usr/sbin/policy-rc.d
      changed_when: false

    - name: "PROC-022 | Establecer Zona Horaria America/Bogota"
      ansible.builtin.raw: |
        timedatectl set-timezone America/Bogota || (ln -sf /usr/share/zoneinfo/America/Bogota /etc/localtime && echo "America/Bogota" > /etc/timezone)
      changed_when: false

    - name: "PROC-022 | Sincronizar reloj de kernel con el Hardware Virtual / Nova (172.27.1.79)"
      ansible.builtin.raw: |
        systemctl stop systemd-timesyncd 2>/dev/null || true
        echo "[Time]" > /etc/systemd/timesyncd.conf
        echo "NTP=172.27.1.79" >> /etc/systemd/timesyncd.conf
        systemctl start systemd-timesyncd 2>/dev/null || true
        hwclock --hctosys 2>/dev/null || true
      changed_when: false

# Installation of common tools at all hosts
- name: Configuring hosts
  hosts: hosts
  become: yes
  roles:
    - hosts

# Installation and configuration of each host
- name: Configuring devices separately
  hosts: hosts
  become: yes
  tasks:
  - name: include role
    include_role:
      name: "{{ inventory_hostname }}"

# Enable SSH access to attacker
- name: Configuring hosts
  hosts: attacker
  become: yes
  roles:
    - role: user-access
      user_access_username: user
      user_access_password: Password123
      user_access_sudo: True
    - role: chrony
    - role: attacker

# Configure DNS an Repositories
- hosts: attacker
  become: true
  tasks:
    - name: Set DNS server on attacker
      lineinfile:
        path: /etc/resolv.conf
        line: "nameserver 8.8.8.8"
        
- name: setup hosts logging roles
  hosts:
    - router
    - hosts
  become: yes
  vars:
    sandbox_name: junior-hacker-local
   #central_syslog_ip: 192.168.100.1
  roles:
    - role: sandbox-logging
      slf_destination_port: '{% if hostvars["man"] is defined -%} 514 {%- else -%} 515 {%- endif %}'
      slf_destination: '{% if hostvars["man"] is defined -%} {{ hostvars["man"].ansible_host }} {%- else -%} {{ central_syslog_ip }} {%- endif %}'
      slf_sandbox_id: "{{ global_sandbox_id | default(student_id) | default(0) }}"
      slf_sandbox_name: '{{ global_sandbox_name | default(sandbox_name) }}'
      slf_pool_id: '{{ global_pool_id | default(None) }}'
