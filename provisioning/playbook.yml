---
- name: Validar disponibilidad de las instancias
  hosts: hosts
  gather_facts: no
  tasks:
    - name: Esperar conexión SSH activa antes de configurar
      wait_for_connection:
        delay: 5
        timeout: 120
        
# Basic configuration of all defined devices

- name: Pre-configurar entorno, zona horaria y proteccion apt
  hosts: all
  gather_facts: no
  become: yes
  environment:
    DEBIAN_FRONTEND: noninteractive
  tasks:
    - name: "PROC-024 | Desactivar actualizaciones automaticas de fondo que bloquean dpkg/apt"
      ansible.builtin.raw: |
        systemctl stop unattended-upgrades apt-daily.timer apt-daily-upgrade.timer 2>/dev/null || true
        systemctl disable unattended-upgrades apt-daily.timer apt-daily-upgrade.timer 2>/dev/null || true
        pkill -9 -f "apt|apt-get|dpkg" 2>/dev/null || true
        rm -f /var/lib/dpkg/lock* /var/lib/apt/lists/lock /var/cache/apt/archives/lock
        dpkg --configure -a --force-confold 2>/dev/null || true
      changed_when: falsenfold 2>/dev/null || true
      changed_when: false

# Installation of common tools at all hosts
- name: Configuring hosts
  hosts: hosts
  become: yes
  roles:
    - hosts

# Installation and configuration of each host
- name: Configuring devices separately
  hosts: hosts
  become: yes
  tasks:
  - name: include role
    include_role:
      name: "{{ inventory_hostname }}"

# Enable SSH access to attacker
- name: Configuring hosts
  hosts: attacker
  become: yes
  roles:
    - role: user-access
      user_access_username: user
      user_access_password: Password123
      user_access_sudo: True
    - role: chrony
    - role: attacker

# Configure DNS an Repositories
- hosts: attacker
  become: true
  tasks:
    - name: Set DNS server on attacker
      lineinfile:
        path: /etc/resolv.conf
        line: "nameserver 8.8.8.8"
        
- name: setup hosts logging roles
  hosts:
    - routers
    - hosts
  become: yes
  vars:
    sandbox_name: junior-hacker-local
    central_syslog_ip: 172.27.0.3
  roles:
    - role: sandbox-logging
      slf_destination_port: '{% if hostvars["man"] is defined -%} 514 {%- else -%} 515 {%- endif %}'
      slf_destination: '{% if hostvars["man"] is defined -%} {{ hostvars["man"].ansible_host }} {%- else -%} {{ central_syslog_ip }} {%- endif %}'
      slf_sandbox_id: "{{ global_sandbox_id | default(student_id) | default(0) }}"
      slf_sandbox_name: '{{ global_sandbox_name | default(sandbox_name) }}'
      slf_pool_id: '{{ global_pool_id | default(None) }}'
