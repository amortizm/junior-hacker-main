[defaults]
# Procesa las máquinas del sandbox en paralelo (ajustado al tuning de workers)
forks = 5

# Desactiva generación de archivos .retry
retry_files_enabled = False

# Optimización de caché de facts en disco temporal
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_fact_cache
fact_caching_timeout = 7200

# Desactiva recolección profunda de red para acelerar el gathering (Ubicación correcta)
gather_subset = !all,!network

# Timeout de comandos a nivel de ejecutor
command_timeout = 30
timeout = 30

[ssh_connection]
# Acelera x4 la ejecución combinando llamadas en lotes
pipelining = True

# Reutilización de socket ControlMaster y KeepAlive agresivo para tolerancia a Netplan
ssh_args = -o ControlMaster=auto -o ControlPersist=180s -o PreferredAuthentications=publickey -o ServerAliveInterval=5 -o ServerAliveCountMax=10 -o ConnectionAttempts=10

# Reintentos automáticos si el socket SSH cae durante el reintento de red (Netplan)
retries = 5

[openstack_connection]
timeout = 30
retries = 5

[kubernetes_connection]
active_deadline_seconds = 120
terminate_grace_period_seconds = 30
